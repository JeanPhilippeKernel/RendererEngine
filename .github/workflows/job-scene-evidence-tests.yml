name: Scene evidence tests

on:
  workflow_call:

jobs:
  scene-evidence-tests:
    name: Scene evidence tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scene lifecycle and capture evidence tools
        run: python -m unittest discover -s tests/scene/unit -v
