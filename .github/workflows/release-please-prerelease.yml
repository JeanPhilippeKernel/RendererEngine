name: Release Please (Pre-release)

on:
    push:
        branches: [develop]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config-prerelease.json
                  manifest-file: .release-please-manifest-prerelease.json
                  token: ${{ secrets.GITHUB_TOKEN }}

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        strategy:
            matrix:
                include:
                    - os: windows-2022
                      artifact: windows
                      targetFramework: net8.0
                    - os: macos-latest
                      artifact: macOS
                    - os: ubuntu-latest
                      artifact: linux
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Build (${{ matrix.artifact }})
              uses: ./.github/workflows/job-cmakebuild-${{ matrix.artifact }}.yml
              with:
                  targetFramework: ${{ matrix.targetFramework }}

            - name: Upload pre-release artifacts
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  prerelease: true
                  files: |
                      build/**/*.zip
                      build/**/*.tar.gz
