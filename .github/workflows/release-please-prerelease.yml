name: Release Please (Pre-release)

on:
    push:
        branches: [develop]

permissions:
    contents: write
    pull-requests: write
    packages: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config-prerelease.json
                  manifest-file: .release-please-manifest-prerelease.json
                  token: ${{ secrets.GITHUB_TOKEN }}
                  prerelease: true
                  prerelease-type: alpha

    publish-windows:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        uses: ./.github/workflows/job-cmakebuild-windows.yml
        with:
            targetFramework: net8.0
            configuration: Release

    publish-macos:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        uses: ./.github/workflows/job-cmakebuild-macOS.yml
        with:
            targetFramework: net8.0
            configuration: Release

    publish-linux:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        uses: ./.github/workflows/job-cmakebuild-linux.yml
        with:
            targetFramework: net8.0
            configuration: Release

    upload-artifacts:
        needs: [release-please, publish-windows, publish-macos, publish-linux]
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v6
              with:
                  path: artifacts

            - name: Upload to GitHub Pre-release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.release-please.outputs.tag_name }}
                  prerelease: true
                  files: artifacts/**/*
