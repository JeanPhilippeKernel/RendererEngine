name: Engine CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ZEngine/**'
      - 'Tetragrama/**'
      - 'Obelisk/**'
      - 'Resources/**'
      - 'Scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'dependencies.cmake'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ZEngine/**'
      - 'Tetragrama/**'
      - 'Obelisk/**'
      - 'Resources/**'
      - 'Scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'dependencies.cmake'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      run_debug:
        description: 'Build and test Debug'
        type: boolean
        default: true
      run_release:
        description: 'Build and test Release'
        type: boolean
        default: false
      run_deploy:
        description: 'Deploy artifacts'
        type: boolean
        default: false

jobs:
  scene-sanitizers:
    name: Scene CPU sanitizer (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address-undefined
            sanitizer: address,undefined
          - name: thread
            sanitizer: thread
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++ libasound2-dev libgl1-mesa-dev libpulse-dev libdbus-1-dev libglib2.0-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxt-dev libxxf86vm-dev glslang-tools libwayland-dev libxkbcommon-dev pkg-config
      - name: Configure instrumented build
        env:
          CC: gcc
          CXX: g++
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          cmake --preset Linux_x64_Debug \
            "-DCMAKE_C_FLAGS=-fsanitize=${SANITIZER} -fno-omit-frame-pointer" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=${SANITIZER} -fno-sanitize=vptr -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${SANITIZER}" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=${SANITIZER}"
      - name: Build scene tests
        run: cmake --build Result.Linux.x64.Debug --target ZEngineTests -j 2
      - name: Run lifecycle and resource tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          Result.Linux.x64.Debug/ZEngine/tests/ZEngineTests \
            --gtest_filter='CookedObjectSnapshotTest.*:CookedPackageSnapshotTest.*:SceneLoadCoordinatorTest.*:SceneRuntimeCameraTest.*:SceneSubmissionProgressTest.*:SceneInstanceTest.*:SceneResourceBundleTest.*:SceneEnvironmentHandoffTest.*' \
            --gtest_output=xml:scene-sanitizer-results.xml
          python3 Scripts/verify_scene_sanitizer_results.py scene-sanitizer-results.xml

  scene-evidence-tests:
    name: Scene evidence tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scene lifecycle and capture evidence tools
        run: python -m unittest discover -s Scripts/tests -v

  commitlint:
    # A develop-to-main promotion contains historical commits that predate
    # commitlint enforcement. Ordinary pull requests remain fully linted.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.head.ref == 'develop' &&
        github.event.pull_request.base.ref == 'main')
    uses: ./.github/workflows/job-commitlint.yml

  clang-format:
    uses: ./.github/workflows/job-clangformat.yml

  windows:
    needs: [commitlint, clang-format]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/windows-build.yml
    with:
      targetFramework: net10.0
      run_debug: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_debug)) }}
      run_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_release)) }}
      run_deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_deploy)) }}

  macOS:
    needs: [commitlint, clang-format]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/macOS-build.yml
    with:
      targetFramework: net10.0
      run_debug: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_debug)) }}
      run_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_release)) }}
      run_deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_deploy)) }}

  linux:
    needs: [commitlint, clang-format]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/linux-build.yml
    with:
      targetFramework: net10.0
      run_debug: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_debug)) }}
      run_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_release)) }}
      run_deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.run_deploy)) }}
