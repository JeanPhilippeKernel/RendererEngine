# Run tests for Windows
#
name: Windows Test Workflow

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: 'Debug'

jobs:
  test:
    name: test-windows-${{ inputs.configuration }}
    runs-on: windows-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v6
        with:
          name: Build-Windows-x64-${{ inputs.configuration }}

      - name: Run Independent-Process Scene Tests
        shell: pwsh
        run: |
          $env:PATH = "${{github.workspace}}\lib;$env:PATH"
          cmake -P "${{github.workspace}}/tests/SceneDocumentProcess.cmake"

      - name: Run Independent-Process Cook Package Tests
        shell: pwsh
        run: |
          $env:PATH = "${{github.workspace}}\lib;$env:PATH"
          cmake -P "${{github.workspace}}/tests/SceneCookProcess.cmake"

      - name: Run Cook Resource Limits
        shell: pwsh
        run: |
          $env:PATH = "${{github.workspace}}\lib;$env:PATH"
          & "${{github.workspace}}\tests\SceneCookResourceProcess.exe"

      - name: Run Combined Cook Publication Stress
        shell: pwsh
        run: |
          $env:PATH = "${{github.workspace}}\lib;$env:PATH"
          cmake -P "${{github.workspace}}/tests/SceneCookStressProcess.cmake"

      - name: Run Tests
        shell: pwsh
        env:
          PATH: ${{github.workspace}}\lib
        run: ${{github.workspace}}\tests\ZEngineTests.exe

      - name: Run Editor Tests
        shell: pwsh
        env:
          PATH: ${{github.workspace}}\lib
        run: |
          & "${{github.workspace}}\tests\TetragramaTests.exe"
          if ($LASTEXITCODE -ne 0) {
            $nativeCode = [uint32]([int64]$LASTEXITCODE -band 0xFFFFFFFFL)
            Write-Error ("Editor test process failed with native exit code 0x{0:X8}" -f $nativeCode)
            exit 1
          }
