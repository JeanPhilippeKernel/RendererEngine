# Run tests for macOS
#
name: macOS Test Workflow

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: 'Debug'
      architecture:
        type: string
        default: 'arm64'

jobs:
  test:
    name: test-macOS-${{ inputs.architecture }}-${{ inputs.configuration }}
    runs-on: macos-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v6
        with:
          name: Build-macOS-${{ inputs.architecture }}-${{ inputs.configuration }}

      - name: Update test executable permissions
        run: chmod +x ${{github.workspace}}/tests/ZEngineTests ${{github.workspace}}/tests/TetragramaTests ${{github.workspace}}/tests/SceneDocumentProcess ${{github.workspace}}/tests/SceneCookProcess ${{github.workspace}}/tests/SceneCookResourceProcess

      - name: Run Independent-Process Scene Tests
        run: cmake -P "${{github.workspace}}/tests/SceneDocumentProcess.cmake"

      - name: Run Independent-Process Cook Package Tests
        run: cmake -P "${{github.workspace}}/tests/SceneCookProcess.cmake"

      - name: Run Cook Resource Limits
        run: ${{github.workspace}}/tests/SceneCookResourceProcess

      - name: Run Combined Cook Publication Stress
        run: cmake -P "${{github.workspace}}/tests/SceneCookStressProcess.cmake"

      - name: Run Tests
        run: ${{github.workspace}}/tests/ZEngineTests

      - name: Run Editor Tests
        run: ${{github.workspace}}/tests/TetragramaTests
